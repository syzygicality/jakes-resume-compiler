services:
  api:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PROD=true
      - MODE=gRPC
  api-image:
    platform: linux/amd64
    image: ghcr.io/syzygicality/jakes-resume-compiler:latest
    pull_policy: always
    ports:
      - "8081:8080"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PROD=true
